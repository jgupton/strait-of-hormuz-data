name: Pre-market refresh + digest

on:
  schedule:
    # 09:45 UTC = 5:45 AM ET during EDT (winter: shifts to 4:45 ET — adjust to
    # '45 10 * * 1-5' after the November clock change if you care).
    - cron: "45 9 * * 1-5"
  workflow_dispatch: {}   # manual run button for testing tonight

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh upstream mirror data
        run: bash scripts/refresh.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install yfinance pandas

      - name: Run digest
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          ALERT_PHONE: ${{ secrets.ALERT_PHONE }}
        run: python scripts/digest.py

      - name: Commit anything that changed
        run: |
          git config user.name "hormuz-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data docs
          git diff --cached --quiet || git commit -m "refresh + digest $(date -u +'%Y-%m-%d %H:%MZ')"
          git push
